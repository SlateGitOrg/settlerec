[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "settlerec"
version = "0.1.0"
description = "Card settlement reconciliation in DuckDB SQL that proves the clearing account equals an itemised in-transit list."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "settlerec contributors" }]
dependencies = [
  "duckdb>=1.1",
  "sqlglot>=25",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
settlerec = "settlerec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/settlerec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
